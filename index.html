<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Management System</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect } = React;
        
        const App = () => {
          const [chats, setChats] = useState([]);
          const [selectedChat, setSelectedChat] = useState(null);
          const [filter, setFilter] = useState('all');
          const [search, setSearch] = useState('');
          const [message, setMessage] = useState('');
          const [loading, setLoading] = useState(false);
          const [error, setError] = useState('');
          
          // Evolution API Configuration
          const API_URL = 'https://cst-evolution-api-djjvxagd.usecloudstation.com';
          const API_KEY = '8538B6BE7C84-46B2-9368-A13187A1C2D3';
          const INSTANCE_NAME = 'abc';
          
          const teamMembers = ['Unassigned', 'John Doe', 'Jane Smith', 'Mike Wilson', 'Sarah Parker'];
          
          // Fetch chats - trying different endpoints
          const fetchChats = async () => {
            setLoading(true);
            setError('');
            
            // Try multiple endpoint variations
            const endpoints = [
              `/chat/findMessages/${INSTANCE_NAME}`,
              `/message/findMessages/${INSTANCE_NAME}`,
              `/chat/find/${INSTANCE_NAME}`,
              `/instance/fetchInstances/${INSTANCE_NAME}`
            ];
            
            for (const endpoint of endpoints) {
              try {
                console.log('Trying endpoint:', API_URL + endpoint);
                
                const response = await fetch(API_URL + endpoint, {
                  method: 'GET',
                  headers: {
                    'apikey': API_KEY,
                    'Content-Type': 'application/json'
                  }
                });
                
                console.log('Response status:', response.status);
                
                if (response.ok) {
                  const data = await response.json();
                  console.log('Success! Data:', data);
                  
                  // Transform data
                  let chatsArray = [];
                  
                  if (Array.isArray(data)) {
                    chatsArray = data;
                  } else if (data.instance?.chats) {
                    chatsArray = data.instance.chats;
                  } else if (data.chats) {
                    chatsArray = data.chats;
                  } else if (data.messages) {
                    chatsArray = data.messages;
                  }
                  
                  const transformedChats = chatsArray.map((chat, index) => ({
                    id: chat.id || chat.remoteJid || chat.key?.remoteJid || index,
                    name: chat.pushName || chat.verifiedName || chat.name || chat.key?.remoteJid?.split('@')[0] || 'Unknown',
                    phone: chat.remoteJid || chat.key?.remoteJid || chat.id || 'No number',
                    lastMessage: chat.message?.conversation || chat.message?.extendedTextMessage?.text || chat.lastMessage || 'No message',
                    timestamp: chat.messageTimestamp ? new Date(chat.messageTimestamp * 1000).toLocaleString() : 'Unknown',
                    status: 'open',
                    assignedTo: 'Unassigned',
                    unreadCount: chat.unreadCount || 0
                  }));
                  
                  setChats(transformedChats);
                  setLoading(false);
                  return; // Success, exit
                }
              } catch (err) {
                console.error('Error with endpoint:', endpoint, err);
              }
            }
            
            // If all endpoints fail
            setError('Could not fetch chats. Check console for details.');
            setLoading(false);
          };
          
          // Send message
          const sendMessage = async () => {
            if (!message.trim() || !selectedChat) return;
            
            try {
              const phoneNumber = selectedChat.phone.replace(/[^0-9]/g, '');
              
              const response = await fetch(`${API_URL}/message/sendText/${INSTANCE_NAME}`, {
                method: 'POST',
                headers: {
                  'apikey': API_KEY,
                  'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                  number: phoneNumber,
                  text: message
                })
              });
              
              if (response.ok) {
                setMessage('');
                alert('Message sent!');
                fetchChats();
              } else {
                const errorText = await response.text();
                alert('Failed: ' + errorText);
              }
            } catch (error) {
              alert('Error: ' + error.message);
            }
          };
          
          useEffect(() => {
            fetchChats();
            const interval = setInterval(fetchChats, 30000);
            return () => clearInterval(interval);
          }, []);
          
          const filteredChats = chats.filter(chat => {
            const matchFilter = filter === 'all' || chat.status === filter;
            const matchSearch = chat.name.toLowerCase().includes(search.toLowerCase()) || chat.phone.includes(search);
            return matchFilter && matchSearch;
          });
          
          const updateStatus = (id, newStatus) => {
            setChats(chats.map(c => c.id === id ? {...c, status: newStatus} : c));
            if(selectedChat?.id === id) setSelectedChat({...selectedChat, status: newStatus});
          };
          
          const assignChat = (id, member) => {
            setChats(chats.map(c => c.id === id ? {...c, assignedTo: member} : c));
            if(selectedChat?.id === id) setSelectedChat({...selectedChat, assignedTo: member});
          };
          
          const stats = {
            total: chats.length,
            open: chats.filter(c => c.status === 'open').length,
            closed: chats.filter(c => c.status === 'closed').length,
            unassigned: chats.filter(c => c.assignedTo === 'Unassigned').length
          };
          
          return (
            <div className="min-h-screen bg-gray-50">
              <div className="bg-white border-b px-6 py-4">
                <div className="flex items-center justify-between mb-4">
                  <h1 className="text-2xl font-bold">WhatsApp Management System</h1>
                  <div className="flex gap-2">
                    <button 
                      onClick={fetchChats} 
                      disabled={loading}
                      className="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 disabled:bg-gray-400"
                    >
                      {loading ? 'Loading...' : 'Refresh'}
                    </button>
                    <button 
                      onClick={() => window.open('https://cst-evolution-api-djjvxagd.usecloudstation.com/manager/', '_blank')}
                      className="bg-gray-600 text-white px-4 py-2 rounded-lg hover:bg-gray-700"
                    >
                      Open Manager
                    </button>
                  </div>
                </div>
                
                {error && (
                  <div className="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded mb-4">
                    {error}
                  </div>
                )}
                
                <div className="grid grid-cols-4 gap-4">
                  <div className="bg-blue-50 p-4 rounded-lg">
                    <div className="text-2xl font-bold text-blue-600">{stats.total}</div>
                    <div className="text-sm text-blue-800">Total Chats</div>
                  </div>
                  <div className="bg-green-50 p-4 rounded-lg">
                    <div className="text-2xl font-bold text-green-600">{stats.open}</div>
                    <div className="text-sm text-green-800">Open</div>
                  </div>
                  <div className="bg-gray-50 p-4 rounded-lg">
                    <div className="text-2xl font-bold text-gray-600">{stats.closed}</div>
                    <div className="text-sm text-gray-800">Closed</div>
                  </div>
                  <div className="bg-orange-50 p-4 rounded-lg">
                    <div className="text-2xl font-bold text-orange-600">{stats.unassigned}</div>
                    <div className="text-sm text-orange-800">Unassigned</div>
                  </div>
                </div>
              </div>
              
              <div className="flex h-[calc(100vh-180px)]">
                <div className="w-96 bg-white border-r flex flex-col">
                  <div className="p-4 border-b">
                    <input
                      type="text"
                      placeholder="Search chats..."
                      value={search}
                      onChange={(e) => setSearch(e.target.value)}
                      className="w-full px-4 py-2 border rounded-lg mb-3 focus:ring-2 focus:ring-green-500"
                    />
                    
                    <div className="flex gap-2">
                      <button onClick={() => setFilter('all')} className={`flex-1 px-3 py-2 rounded-lg text-sm font-medium ${filter === 'all' ? 'bg-green-600 text-white' : 'bg-gray-100'}`}>All</button>
                      <button onClick={() => setFilter('open')} className={`flex-1 px-3 py-2 rounded-lg text-sm font-medium ${filter === 'open' ? 'bg-green-600 text-white' : 'bg-gray-100'}`}>Open</button>
                      <button onClick={() => setFilter('closed')} className={`flex-1 px-3 py-2 rounded-lg text-sm font-medium ${filter === 'closed' ? 'bg-green-600 text-white' : 'bg-gray-100'}`}>Closed</button>
                    </div>
                  </div>
                  
                  <div className="flex-1 overflow-y-auto">
                    {filteredChats.length === 0 ? (
                      <div className="p-8 text-center text-gray-500">
                        {loading ? 'Loading chats...' : 'No chats found. Check browser console (F12) for details.'}
                      </div>
                    ) : (
                      filteredChats.map(chat => (
                        <div key={chat.id} onClick={() => setSelectedChat(chat)} className={`p-4 border-b cursor-pointer hover:bg-gray-50 ${selectedChat?.id === chat.id ? 'bg-green-50' : ''}`}>
                          <div className="flex justify-between mb-1">
                            <div className="flex-1">
                              <div className="font-semibold">{chat.name}</div>
                              <div className="text-xs text-gray-500">{chat.phone}</div>
                            </div>
                            {chat.unreadCount > 0 && (
                              <span className="bg-green-600 text-white text-xs rounded-full px-2 py-1">{chat.unreadCount}</span>
                            )}
                          </div>
                          <div className="text-sm text-gray-600 truncate mb-2">{chat.lastMessage}</div>
                          <div className="flex justify-between text-xs">
                            <span className="text-gray-500">{chat.timestamp}</span>
                            <span className={`px-2 py-1 rounded-full ${chat.status === 'open' ? 'bg-green-100 text-green-800' : 'bg-gray-100'}`}>{chat.status}</span>
                          </div>
                        </div>
                      ))
                    )}
                  </div>
                </div>
                
                <div className="flex-1 flex flex-col bg-gray-50">
                  {selectedChat ? (
                    <>
                      <div className="bg-white border-b px-6 py-4">
                        <div className="flex justify-between items-center">
                          <div>
                            <h2 className="text-lg font-semibold">{selectedChat.name}</h2>
                            <p className="text-sm text-gray-500">{selectedChat.phone}</p>
                          </div>
                          <div className="flex gap-3">
                            <select value={selectedChat.assignedTo} onChange={(e) => assignChat(selectedChat.id, e.target.value)} className="px-4 py-2 border rounded-lg text-sm">
                              {teamMembers.map(m => <option key={m} value={m}>{m}</option>)}
                            </select>
                            <button onClick={() => updateStatus(selectedChat.id, selectedChat.status === 'open' ? 'closed' : 'open')} className={`px-4 py-2 rounded-lg text-sm font-medium ${selectedChat.status === 'open' ? 'bg-gray-600 text-white' : 'bg-green-600 text-white'}`}>
                              {selectedChat.status === 'open' ? 'Close' : 'Reopen'}
                            </button>
                          </div>
                        </div>
                      </div>
                      
                      <div className="flex-1 overflow-y-auto p-6">
                        <div className="text-center text-gray-500">
                          <p className="mb-2">💬 Chat with {selectedChat.name}</p>
                        </div>
                      </div>
                      
                      <div className="bg-white border-t px-6 py-4">
                        <div className="flex gap-3">
                          <input
                            type="text"
                            value={message}
                            onChange={(e) => setMessage(e.target.value)}
                            onKeyPress={(e) => e.key === 'Enter' && sendMessage()}
                            placeholder="Type a message..."
                            className="flex-1 px-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-500"
                          />
                          <button onClick={sendMessage} className="bg-green-600 text-white px-6 py-2 rounded-lg hover:bg-green-700">Send</button>
                        </div>
                      </div>
                    </>
                  ) : (
                    <div className="flex-1 flex items-center justify-center">
                      <div className="text-center text-gray-500">
                        <p className="text-lg">Select a chat to start messaging</p>
                      </div>
                    </div>
                  )}
                </div>
              </div>
            </div>
          );
        };
        
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
